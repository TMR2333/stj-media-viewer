name: macOS dmg

# 在 GitHub Actions 的 macOS runner 上构建 .app + .dmg（Windows 上无法产出 Mach-O）。
# 手动触发，或在 push 到 main 且改动 macos/ 时触发。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-dmg.yml'

jobs:
  build-dmg:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build app + dmg
        run: bash macos/scripts/build-dmg.sh

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: STJMediaViewer-macos-dmg
          path: macos/dist/*.dmg
          if-no-files-found: error